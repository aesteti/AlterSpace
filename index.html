<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlterSpace</title>
  <style>
    body {
      margin: 0;
      font-family: Pixelify Sans, sans-serif;
      color: #f0f0f0;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                  url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejB5bXJmNWNuMGE4eDFyYW1vNGl2cThxbjBhZDhzemVuNGVwZGc0NyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/TexuKBfvpWjaIuACrz/giphy.gif');
      background-size: cover;
      background-position: center 0;
      background-repeat: no-repeat;
    }

    header {
      background-color: rgba(34, 34, 34, 0.8);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      color: #ffcc00;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    nav a {
      color: #ccc;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      transition: 0.3s;
    }

    nav a:hover {
      background: rgba(255, 204, 0, 0.6);
      color: #000;
    }

    .banner {
      background-color: rgba(51, 51, 51, 0.7);
      padding: 40px 20px;
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .item {
      background: rgba(34, 34, 34, 0.85);
      padding: 10px;
      border-radius: 5px;
      text-align: center;
    }

    .item img {
      width: 100%;
      height: auto;
      border-radius: 5px;
    }

    .chat-container {
      background: rgba(34, 34, 34, 0.85);
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      text-align: center;
      color: #fff;
    }

    #chatTimeline {
      max-height: 300px;
      overflow-y: auto;
      text-align: left;
      padding: 10px;
      border: 1px solid #555;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 6px;
    }

    textarea {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #ffcc00;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      background: rgba(17, 17, 17, 0.9);
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>

  <header>
    <h1>AlterSpace</h1>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Juegos</a>
      <a href="#">Animaciones</a>
      <a href="#">Arte</a>
      <a href="#">Audio</a>
      <a href="login.html" id="loginLink">Iniciar sesión</a> 
    </nav>
  </header>

  <section class="banner">
    <h2 id="welcomeMessage">Bienvenido a AlterSpace</h2>
    <p>Explora contenido hecho por creadores independientes</p>
  </section>

  <section class="gallery">
    <div class="item">
      <img src="https://via.placeholder.com/200x150" alt="Proyecto 1">
      <p><strong>Juego 1</strong></p>
    </div>
    <div class="item">
      <img src="https://via.placeholder.com/200x150" alt="Proyecto 2">
      <p><strong>Animación 1</strong></p>
    </div>
    <div class="item">
      <img src="https://via.placeholder.com/200x150" alt="Proyecto 3">
      <p><strong>Arte 1</strong></p>
    </div>
  </section>

  <section class="chat-container">
    <h2>💬 Chat Global</h2>
    <div id="chatTimeline"></div>
    <textarea id="chatInput" placeholder="Escribe tu mensaje..."></textarea>
    <button onclick="sendMessage()">Enviar</button>
  </section>

  <footer>
    &copy; 2025 AlterSpace
  </footer>

  <script>
    window.onload = function() {
      const isLoggedIn = localStorage.getItem("isLoggedIn");
      const storedUser = JSON.parse(localStorage.getItem("userData"));

      if (isLoggedIn && storedUser) {
        document.getElementById("welcomeMessage").textContent = `Bienvenido de nuevo, ${storedUser.username}!`;
        document.getElementById("loginLink").style.display = "none";
      }

      displayMessages();
    };

    function sendMessage() {
      const chatInput = document.getElementById("chatInput").value.trim();
      if (!chatInput) return;

      const storedUser = JSON.parse(localStorage.getItem("userData"));
      if (!storedUser) {
        alert("❌ Debes iniciar sesión para enviar mensajes.");
        return;
      }

      const newMessage = { username: storedUser.username, text: chatInput };
      let chatMessages = JSON.parse(localStorage.getItem("chatMessages")) || [];
      chatMessages.push(newMessage);
      localStorage.setItem("chatMessages", JSON.stringify(chatMessages));

      document.getElementById("chatInput").value = "";
      displayMessages();
    }

    function displayMessages() {
      const chatTimeline = document.getElementById("chatTimeline");
      chatTimeline.innerHTML = "";
      let chatMessages = JSON.parse(localStorage.getItem("chatMessages")) || [];

      chatMessages.forEach(msg => {
        const messageElement = document.createElement("p");
        messageElement.innerHTML = `<strong>${msg.username}:</strong> ${msg.text}`;
        chatTimeline.appendChild(messageElement);
      });
    }
  </script>

</body>
</html>
