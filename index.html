<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlterSpace</title>
  
  <!-- 🔹 Importando la fuente Pixelify Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Pixelify Sans', sans-serif;
      color: #f0f0f0;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                  url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejB5bXJmNWNuMGE4eDFyYW1vNGl2cThxbjBhZDhzemVuNGVwZGc0NyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/TexuKBfvpWjaIuACrz/giphy.gif');
      background-size: cover;
      background-position: center 0;
      background-repeat: no-repeat;
    }

    h1, h2, p, button, nav a {
      font-family: 'Pixelify Sans', sans-serif;
    }

    header {
      background-color: rgba(34, 34, 34, 0.8);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      color: #ffcc00;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    nav a {
      color: #ccc;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      transition: 0.3s;
    }

    nav a:hover {
      background: rgba(255, 204, 0, 0.6);
      color: #000;
    }
    
    /* El resto del código de estilos y contenido permanece igual */

  </style>
</head>
<body>
  
  <header>
    <h1>AlterSpace</h1>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Juegos</a>
      <a href="#">Animaciones</a>
      <a href="#">Arte</a>
      <a href="#">Audio</a>
      <a href="login.html" id="loginLink">Iniciar sesión</a> 
    </nav>
  </header>

  <section class="banner">
    <h2 id="welcomeMessage">Bienvenido a AlterSpace</h2>
    <p>Explora contenido hecho por creadores independientes</p>
  </section>

  <!-- 🔹 Sección del chat global -->
  <section class="chat-container">
    <h2>💬 Chat Global</h2>
    <div id="chatTimeline"></div>
    <textarea id="chatInput" placeholder="Escribe tu mensaje..."></textarea>
    <button onclick="sendMessage()">Enviar</button>
  </section>

  <footer>
    &copy; 2025 AlterSpace
  </footer>

</body>
</html>
