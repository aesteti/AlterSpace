<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlterSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Pixelify Sans', sans-serif; color: #f0f0f0; background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejB5bXJmNWNuMGE4eDFyYW1vNGl2cThxbjBhZDhzemVuNGVwZGc0NyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/TexuKBfvpWjaIuACrz/giphy.gif'); background-size: cover; background-position: center; background-repeat: no-repeat; }
  h1, h2, p, button, nav a { font-family: 'Pixelify Sans', sans-serif; }
  header { background-color: rgba(34, 34, 34, 0.8); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; color: #ffcc00; }
  nav { display: flex; gap: 10px; }
  nav a { color: #ccc; text-decoration: none; padding: 8px 12px; border-radius: 6px; transition: 0.3s; }
  nav a:hover { background: rgba(255, 204, 0, 0.6); color: #000; }
  .banner { background-color: rgba(51, 51, 51, 0.7); padding: 40px 20px; text-align: center; }
  .chat-container { background: rgba(34, 34, 34, 0.85); padding: 20px; border-radius: 10px; max-width: 600px; width: 90%; margin: 50px auto; text-align: center; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #chatTimeline { max-height: 300px; overflow-y: auto; width: 100%; text-align: left; padding: 10px; border: 1px solid #555; background: rgba(0, 0, 0, 0.7); border-radius: 6px; }
  textarea { width: 100%; height: 50px; margin-top: 10px; padding: 8px; border-radius: 5px; border: none; }
  button { margin-top: 10px; width: 100%; padding: 10px; background: #ffcc00; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
  footer { background: rgba(17, 17, 17, 0.9); text-align: center; padding: 20px; font-size: 14px; color: #999; }
</style>
</head>
<body>
  <header>
    <h1>AlterSpace</h1>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Juegos</a>
      <a href="#">Animaciones</a>
      <a href="#">Arte</a>
      <a href="#">Audio</a>
      <a href="login.html" id="loginLink">Iniciar sesión</a>
    </nav>
  </header>
  <section class="banner">
    <h2 id="welcomeMessage">Bienvenido a AlterSpace</h2>
    <p>Explora contenido hecho por creadores independientes</p>
  </section>
  <section class="chat-container">
    <h2>💬 Chat Global</h2>
    <div id="chatTimeline"></div>
    <textarea id="chatInput" placeholder="Escribe tu mensaje..."></textarea>
    <button onclick="sendMessage()">Enviar</button>
  </section>
  <footer>
    &copy; 2025 AlterSpace
  </footer>
  <script>
    function sendMessage() {
      const input = document.getElementById('chatInput');
      const timeline = document.getElementById('chatTimeline');
      if (input.value.trim() !== "") {
        const p = document.createElement('p');
        p.textContent = input.value;
        timeline.appendChild(p);
        input.value = "";
        timeline.scrollTop = timeline.scrollHeight;
      }
    }
  </script>
</body>
</html>
